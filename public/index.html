<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HelpInk</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#fafafa;--cd:#fff;--tx:#18181b;--mu:#71717a;--bd:#e4e4e7;--in:#f4f4f5;--g:#f5b0cd;--gl:#fdf0f6;--gt:#be185d;--on:#4a0d2b;--am:#fef3c7;--amt:#92400e;--rd:#fee2e2;--rdt:#b91c1c;--bl:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f11;--cd:#1a1a1e;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2c2c32;--in:#242429;--gl:#500724;--gt:#f9a8d4;--am:#451a03;--amt:#fcd34d;--rd:#450a0a;--rdt:#fca5a5;--bl:#2c2c32}}
:root[data-theme="dark"]{--bg:#0f0f11;--cd:#1a1a1e;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2c2c32;--in:#242429;--gl:#500724;--gt:#f9a8d4;--am:#451a03;--amt:#fcd34d;--rd:#450a0a;--rdt:#fca5a5;--bl:#2c2c32}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{display:flex;min-height:100vh}
nav{width:240px;background:#18181b;color:#a1a1aa;padding:24px 14px;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;gap:6px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:20px;padding:0 8px 22px}
.logo b{background:#f5b0cd;color:#4a0d2b;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:16px}
nav button:hover{background:#27272a}nav button.on{background:var(--g);color:var(--on)}
nav button i{font-style:normal;width:22px;text-align:center}
main{margin-left:240px;flex:1;padding:28px 32px;max-width:1200px;min-width:0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:26px}h2{margin:0;font-size:18px}.sub{color:var(--mu);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px}
.st .top{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}.st .top em{font-style:normal;color:var(--gt)}
.st .n{font-size:24px;font-weight:700;margin:12px 0 2px}.st .l{color:var(--mu);font-size:14px}
.ic{width:38px;height:38px;border-radius:10px;background:var(--gl);display:grid;place-items:center}
.row{display:flex;align-items:center;gap:14px;background:var(--in);border-radius:10px;padding:12px 14px;margin-top:10px;flex-wrap:wrap}
.row .t{min-width:56px;text-align:center;font-weight:600;color:var(--gt)}.row .t small{display:block;color:var(--mu);font-weight:400}
.row .m{flex:1;min-width:140px}.row .m small{color:var(--mu);display:block;font-size:13px}
.row .v{text-align:right;font-size:13px;color:var(--mu)}.row .v b{display:block;color:var(--tx);font-size:15px}
.bd{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--gl);color:var(--gt);white-space:nowrap}
.bd.p{background:var(--am);color:var(--amt)}.bd.x{background:var(--rd);color:var(--rdt)}.bd.c{background:var(--bl);color:var(--mu)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.btn{all:unset;cursor:pointer;background:var(--g);color:var(--on);padding:10px 16px;border-radius:10px;font-size:15px;font-weight:500;text-align:center}
.btn.s{background:var(--in);color:var(--tx);padding:7px 12px;font-size:13px}.btn.d{background:var(--rd);color:var(--rdt)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
.bar input{width:auto;flex:1;min-width:160px}.bar input[type=month]{flex:0}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}label.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:14px}label.ck input{width:20px;height:20px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:12px}
.modal>div{background:var(--cd);border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.note{font-size:13px;background:var(--in);padding:10px;border-radius:10px;color:var(--mu);margin-top:12px}
.acts{display:flex;gap:6px}.empty{text-align:center;color:var(--mu);padding:28px}
textarea.big{min-height:200px;font-family:monospace;font-size:12px}
.pos{color:var(--gt)}.neg{color:var(--rdt)}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}.auth .card{width:100%;max-width:400px;padding:26px}
.auth .logo{display:flex;color:var(--tx);padding:0 0 18px}.auth .logo span{display:inline}.note.neg{color:var(--rdt);background:var(--rd)}
.alinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px}.alinks a{color:var(--gt);text-decoration:none}
#sync{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:60;font-size:13px;padding:6px 12px;border-radius:99px;background:var(--in);color:var(--mu);border:1px solid var(--bd)}
#sync.err{background:var(--rd);color:var(--rdt);cursor:pointer}#sync.hide{display:none}
@media(max-width:1023px){nav{width:72px;align-items:center}nav button span,.logo span{display:none}nav button{padding:12px}main{margin-left:72px;padding:22px}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){nav{top:auto;width:100%;height:calc(62px + env(safe-area-inset-bottom,0px));flex-direction:row;justify-content:space-around;padding:6px 4px env(safe-area-inset-bottom,0px);gap:0}.logo{display:none}
nav button{flex-direction:column;gap:2px;padding:6px 8px;font-size:10px}nav button span{display:block}main{margin-left:0;padding:16px 14px 90px}h1{font-size:21px}.f2{grid-template-columns:1fr}.grid{gap:10px}.row .v{text-align:left}}
</style></head><body>
<div id="auth"></div><div id="app" style="display:none"><nav id="nav"></nav><main id="main"></main></div><div id="mod"></div><div id="sync" class="hide"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
let badD=0;
function toISO(s){s=s.trim();if(!s)return'';const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);if(m){const d=new Date(m[3],m[2]-1,m[1]);if(d.getFullYear()==m[3]&&d.getMonth()==m[2]-1&&d.getDate()==m[1])return m[3]+'-'+m[2]+'-'+m[1]}badD=1;return''}
function mask(e){let v=e.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.value=v}
function maskT(e){let v=e.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+':'+v.slice(2);e.value=v}
function toT(s){s=s.trim();if(!s)return'';const m=/^(\d{1,2}):?(\d{2})$/.exec(s);if(m&&+m[1]<24&&+m[2]<60)return m[1].padStart(2,'0')+':'+m[2];badD=1;return''}
let est='';const ESTILOS=['Realismo','Blackwork','Fineline','Old School (Tradicional)','Neotradicional','Aquarela','Geométrico','Pontilhismo (Dotwork)','Oriental / Irezumi','Tribal','Maori','Lettering','Minimalista','Biomecânico','Surrealismo','Trash Polka','Cobertura (Cover-up)','Retoque','Outro'];
function filt(){return`<div style="display:flex;gap:8px;flex-wrap:wrap">${monthIn()}<select style="width:auto" onchange="est=this.value;render()"><option value="">Todos os estilos</option>${ESTILOS.map(e=>`<option ${e===est?'selected':''}>${e}</option>`).join('')}</select></div>`}
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const COLS=['clients','sessions','personal','stock','buys'];
const blank=()=>({studio:'Meu Estúdio',clients:[],sessions:[],personal:[],stock:[],buys:[]});
let db=blank(),tab='dash',per=today().slice(0,7),q='';
/* ---- Banco de dados (Cloudflare D1 via /api): cada item é uma linha em records ---- */
let user=null,snap=null,queue=Promise.resolve(),pend=0,syncErr=null;
async function api(path,body){let r;
 try{r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body&&JSON.stringify(body),credentials:'same-origin',redirect:'manual',cache:'no-store'})}
 catch(e){throw new Error('Sem conexão com o servidor. Verifique sua internet.')}
 // Sessão do Cloudflare Access expirada: a resposta vira um redirecionamento para a tela de login
 if(r.type==='opaqueredirect'||r.status===401){const e=new Error('Sua sessão expirou. Entre novamente.');e.auth=1;throw e}
 const j=await r.json().catch(()=>null);if(!r.ok||!j)throw new Error((j&&j.error)||'Erro do servidor ('+r.status+')');return j}
const meta=()=>({studio:db.studio,named:!!db.named});
// Foto do estado atual: "coleção|id" -> JSON. Comparando com a última foto salva sabemos o que mudou.
function snapshot(){const m=new Map([['meta|profile',JSON.stringify(meta())]]);for(const c of COLS)for(const r of db[c]||[])m.set(c+'|'+r.id,JSON.stringify(r));return m}
async function sync(){if(!user||!snap)return;const cur=snapshot(),ups=[],dels=[];
 for(const[k,s]of cur)if(snap.get(k)!==s){const i=k.indexOf('|');ups.push({col:k.slice(0,i),id:k.slice(i+1),data:JSON.parse(s)})}
 for(const k of snap.keys())if(!cur.has(k)){const i=k.indexOf('|');dels.push({col:k.slice(0,i),id:k.slice(i+1)})}
 for(let i=0;i<ups.length;i+=200)await api('/api/sync',{ups:ups.slice(i,i+200),dels:[]});
 for(let i=0;i<dels.length;i+=200)await api('/api/sync',{ups:[],dels:dels.slice(i,i+200)});
 snap=cur}
function save(){pend++;showSync();queue=queue.then(sync).then(()=>{syncErr=null},e=>{console.error(e);syncErr=e}).then(()=>{pend--;showSync()});return queue}
function showSync(){const e=$('#sync');if(!e)return;
 if(pend){e.className='';e.textContent='Salvando…';e.onclick=null}
 else if(syncErr&&syncErr.auth){e.className='err';e.textContent='⚠ Sessão expirada — toque para entrar de novo (a última alteração não foi salva)';e.onclick=()=>{syncErr=null;location.reload()}}
 else if(syncErr){e.className='err';e.textContent='⚠ Não foi possível salvar — toque para tentar de novo';e.onclick=()=>save()}
 else{e.className='hide';e.onclick=null}}
addEventListener('beforeunload',e=>{if(pend||syncErr){e.preventDefault();e.returnValue=''}});
async function loadDB(){const r=await api('/api/data'),rows=r.rows;
 db=blank();for(const r of rows){if(r.col==='meta')Object.assign(db,{studio:r.data.studio||'Meu Estúdio',named:!!r.data.named});else if(db[r.col])db[r.col].push(r.data)}
 snap=snapshot();syncErr=null;return rows.length}
/* ---- Dados antigos (versão que salvava em cookies/localStorage neste navegador) ---- */
const CK='bink';
function legacy(){let s=null;
 try{const c=Object.fromEntries(document.cookie.split('; ').map(x=>x.split(/=(.*)/s).slice(0,2)));const n=+c[CK+'n'];
  if(n){let p='';for(let i=0;i<n;i++)p+=c[CK+i]||'';s=decodeURIComponent(p)}}catch(e){}
 if(!s)try{s=localStorage.getItem(CK)}catch(e){}
 try{const d=s&&JSON.parse(s);return d&&(d.named||COLS.some(c=>(d[c]||[]).length))?d:null}catch(e){return null}}
function clearLegacy(){try{localStorage.removeItem(CK)}catch(e){}
 try{for(let i=0;i<60;i++)document.cookie=`${CK}${i}=;max-age=0;path=/`;document.cookie=`${CK}n=;max-age=0;path=/`}catch(e){}}
/* ---- Modal / formulário genérico ---- */
function form(title,fields,v,ok,del){v=v||{};
 const h=fields.map(f=>{if(f.t==='note')return`<div class="note">${f.l}</div>`;
  const val=v[f.k]!=null?v[f.k]:(f.d!=null?f.d:'');let i;
  if(f.t==='ck')return`<label class="ck"><input type="checkbox" id="f_${f.k}" ${v[f.k]?'checked':''}>${f.l}</label>`;
  if(f.t==='sel')i=`<select id="f_${f.k}">${f.o.map(o=>{const a=Array.isArray(o)?o:[o,o];return`<option value="${esc(a[0])}" ${a[0]==val?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
  else if(f.t==='ta')i=`<textarea id="f_${f.k}" rows="3">${esc(val)}</textarea>`;
  else if(f.t==='time')i=`<input id="f_${f.k}" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" oninput="maskT(this)" value="${esc(val)}">`;
  else if(f.t==='date')i=`<input id="f_${f.k}" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" oninput="mask(this)" value="${fd(val)}">`;
  else i=`<input id="f_${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="0.01" inputmode="decimal"':''} value="${esc(val)}">`;
  return`<div style="${f.w?'':'grid-column:1/-1'}"><label>${f.l}</label>${i}</div>`}).join('');
 $('#mod').innerHTML=`<div class="modal" onclick="if(event.target===this)bk()"><div><h2>${title}</h2><div class="f2">${h}</div>
 <div class="bar" style="margin:18px 0 0"><button class="btn" id="sv">Salvar</button><button class="btn s" onclick="closeM()">Cancelar</button>${del?'<button class="btn s d" id="dl">Excluir</button>':''}</div></div></div>`;
 $('#sv').onclick=()=>{badD=0;const o={};for(const f of fields){if(f.t==='note')continue;const e=$('#f_'+f.k);o[f.k]=f.t==='ck'?e.checked:f.t==='number'?(parseFloat(e.value)||0):f.t==='date'?toISO(e.value):f.t==='time'?toT(e.value):e.value.trim()}
  if(badD){alert('Data ou hora inválida. Use dd/mm/aaaa e hh:mm (24 horas).');return}
  if(fields.some(f=>f.r&&!o[f.k])){alert('Preencha os campos obrigatórios.');return}ok(o);save();closeM();render()};
 const snap=()=>fields.map(f=>f.t==='note'?'':(f.t==='ck'?$('#f_'+f.k).checked:$('#f_'+f.k).value)).join('|'),s0=snap();
 window.bk=()=>snap()===s0?closeM():$('#sv').click();
 if(del)$('#dl').onclick=()=>{if(confirm('Excluir este registro?')){del();save();closeM();render()}}}
const closeM=()=>$('#mod').innerHTML='';
/* ---- Dados auxiliares ---- */
const cname=id=>(db.clients.find(c=>c.id===id)||{}).nome||'—';
const inP=d=>(d||'').slice(0,7)===per;
const live=s=>s.status!=='Cancelado';
const sumS=(l,k)=>l.reduce((a,s)=>a+(+s[k]||0),0);
const stCls=s=>s==='Confirmado'||s==='Concluído'?'':s==='Cancelado'?'x':'p';
const TERMO='Termo: declaro que fui informado(a) sobre os procedimentos, cuidados e riscos da tatuagem (infecção, alergia, cicatrização), que as informações de saúde são verdadeiras e que autorizo a realização do trabalho.';
/* ---- Formulários ---- */
const clientF=[{k:'nome',l:'Nome completo',r:1},{k:'tel',l:'Telefone / WhatsApp',t:'tel',w:1},{k:'nasc',l:'Nascimento',t:'date',w:1},{k:'email',l:'E-mail',t:'email'},{k:'doc',l:'CPF / RG',w:1},{k:'saude',l:'Anamnese: alergias, medicamentos, doenças',t:'ta'},{k:'obs',l:'Observações',t:'ta'},{t:'note',l:TERMO},{k:'aceite',l:'Cliente leu e aceitou o termo'},{k:'aceiteNome',l:'Nome de quem aceitou',w:1},{k:'aceiteData',l:'Data do aceite',t:'date',w:1}];
clientF[8].t='ck';
const sessF=()=>[{k:'cid',l:'Cliente',t:'sel',o:[['','Selecione…'],...db.clients.map(c=>[c.id,c.nome])],r:1},{k:'desc',l:'Tatuagem / serviço',r:1},{k:'estilo',l:'Estilo da tatuagem',t:'sel',o:[['','Selecione…'],'Realismo','Blackwork','Fineline','Old School (Tradicional)','Neotradicional','Aquarela','Geométrico','Pontilhismo (Dotwork)','Oriental / Irezumi','Tribal','Maori','Lettering','Minimalista','Biomecânico','Surrealismo','Trash Polka','Cobertura (Cover-up)','Retoque','Outro']},{k:'cm',l:'Tamanho (cm)',t:'number',w:1},{k:'cart',l:'Cartuchos utilizados',t:'number',w:1},{k:'data',l:'Data',t:'date',d:today(),w:1,r:1},{k:'hora',l:'Início',t:'time',w:1},{k:'fim',l:'Término',t:'time',w:1},{k:'status',l:'Status',t:'sel',o:['Pendente','Confirmado','Concluído','Cancelado'],w:1},{k:'valor',l:'Valor cobrado (R$)',t:'number',w:1},{k:'material',l:'Custo dos materiais (R$)',t:'number',w:1},{k:'pago',l:'Pagamento recebido'},{k:'obs',l:'Observações',t:'ta'}];
const persF=[{k:'desc',l:'Descrição',r:1},{k:'cat',l:'Categoria',t:'sel',o:['Moradia','Alimentação','Transporte','Estúdio / aluguel','Impostos','Lazer','Outros'],w:1},{k:'data',l:'Data',t:'date',d:today(),w:1,r:1},{k:'valor',l:'Valor (R$)',t:'number',w:1,r:1}];
const stockF=[{k:'nome',l:'Material',r:1},{k:'qtd',l:'Quantidade',t:'number',w:1},{k:'compra',l:'Dia da compra',t:'date',d:today(),w:1,r:1},{k:'fim',l:'Dia que acabou',t:'date',w:1}];
const addC=()=>form('Novo cliente',clientF,{},o=>db.clients.push({id:uid(),...o}));
const edC=id=>{const c=db.clients.find(x=>x.id===id);form('Cliente',clientF,c,o=>Object.assign(c,o),()=>db.clients=db.clients.filter(x=>x.id!==id))};
const addS=()=>db.clients.length?form('Nova sessão',sessF(),{},o=>db.sessions.push({id:uid(),...o})):(alert('Cadastre um cliente primeiro.'),go('cli'));
const edS=id=>{const s=db.sessions.find(x=>x.id===id);form('Sessão',sessF(),s,o=>Object.assign(s,o),()=>db.sessions=db.sessions.filter(x=>x.id!==id))};
const addP=()=>form('Novo custo pessoal',persF,{},o=>db.personal.push({id:uid(),...o}));
const edP=id=>{const s=db.personal.find(x=>x.id===id);form('Custo pessoal',persF,s,o=>Object.assign(s,o),()=>db.personal=db.personal.filter(x=>x.id!==id))};
const addK=()=>form('Novo material',stockF,{},o=>db.stock.push({id:uid(),...o}));
const edK=id=>{const s=db.stock.find(x=>x.id===id);form('Material',stockF,s,o=>Object.assign(s,o),()=>db.stock=db.stock.filter(x=>x.id!==id))};
const buy=id=>{const s=db.stock.find(x=>x.id===id);form('Compra: '+esc(s.nome),[{k:'qtd',l:'Quantidade comprada',t:'number',w:1,r:1},{k:'custo',l:'Custo unitário (R$)',t:'number',d:s.custo,w:1},{k:'data',l:'Data',t:'date',d:today()}],{},o=>{s.qtd=(+s.qtd||0)+o.qtd;s.custo=o.custo||s.custo;db.buys.push({id:uid(),sid:id,...o})})};
const use=id=>{const s=db.stock.find(x=>x.id===id);form('Baixa: '+esc(s.nome),[{k:'qtd',l:'Quantidade usada',t:'number',r:1}],{},o=>s.qtd=Math.max(0,(+s.qtd||0)-o.qtd))};
/* ---- Telas ---- */
const NAV=[['dash','📊','Dashboard'],['cli','👥','Clientes'],['ses','🎨','Tatuagens'],['pes','💳','Pessoal'],['est','📦','Estoque'],['bkp','⚙️','Conta']];
function go(t){tab=t;q='';render();window.scrollTo(0,0);if(t==='usr')loadUsers()}
const pendN=()=>Array.isArray(usrs)?usrs.filter(u=>u.status==='pending').length:0;
const navL=()=>user&&user.admin?[...NAV.slice(0,5),['usr','🔑','Usuários'+(pendN()?' ('+pendN()+')':'')],NAV[5]]:NAV;
const navH=()=>`<div class="logo"><b>H</b><span>HelpInk</span></div>`+navL().map(n=>`<button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i><span>${n[2]}</span></button>`).join('');
/* ---- Usuários (só administradores) ---- */
let usrs=null;
async function loadUsers(){try{usrs=(await api('/api/admin/users')).users}catch(e){usrs={err:e.message}}
 if($('#app').style.display==='none')return;if(tab==='usr')render();else $('#nav').innerHTML=navH()}
const UST={pending:['Aguardando aprovação','p'],approved:['Aprovado',''],rejected:['Recusado','x']};
function vUsr(){const l=Array.isArray(usrs)?usrs:[];
 const A=(i,a,t,c)=>`<button class="btn s ${c||''}" onclick="usrAct(${i},'${a}')">${t}</button>`;
 return`<header><div><h1>Usuários</h1><div class="sub">Quem pediu acesso e quem pode usar o HelpInk</div></div><button class="btn s" onclick="usrs=null;render();loadUsers()">↻ Atualizar</button></header>
 ${!usrs?'<div class="empty">Carregando…</div>':usrs.err?`<div class="note neg">${esc(usrs.err)}</div>`:''}
 ${l.map((u,i)=>{const s=UST[u.status]||[u.status,''];
  return`<div class="row"><div class="m">${esc(u.nome||u.email)}${u.admin?' · administrador':''}<small>${esc(u.email)}${u.estudio?' · '+esc(u.estudio):''}${u.telefone?' · '+esc(u.telefone):''}</small><small>Pedido em ${fd((u.created_at||'').slice(0,10))} · ${u.clientes} clientes · ${u.sessoes} sessões</small></div><span class="bd ${s[1]}">${s[0]}</span>${u.admin?'':`<div class="acts">${u.status!=='approved'?A(i,'approve','Aprovar'):''}${u.status==='pending'?A(i,'reject','Recusar','d'):''}${u.status==='approved'?A(i,'reject','Bloquear','d'):''}${u.status==='rejected'?A(i,'remove','Remover','d'):''}</div>`}</div>`}).join('')||(Array.isArray(usrs)?'<div class="empty">Nenhum usuário ainda.</div>':'')}
 <div class="note">Cada pessoa que entra pelo Cloudflare Access ocupa uma das 50 vagas do plano gratuito, mesmo antes de ser aprovada. Para liberar vagas de quem foi recusado, remova a pessoa também em Cloudflare → Zero Trust → Users.</div>`}
async function usrAct(i,action){const u=usrs[i];if(!u)return;
 const msg={approve:'Aprovar o acesso de '+u.email+'?',reject:'Recusar/bloquear o acesso de '+u.email+'?',remove:'Remover o pedido de '+u.email+'? A pessoa poderá pedir acesso de novo. Os dados dela, se houver, são mantidos.'}[action];
 if(!confirm(msg))return;try{await api('/api/admin/users',{email:u.email,action});await loadUsers()}catch(e){alert(e.message)}}
const monthIn=()=>{const[y,m]=per.split('-'),Y=new Date().getFullYear();let ys='';for(let i=Y-5;i<=Y+1;i++)ys+=`<option ${i==y?'selected':''}>${i}</option>`;
 return`<div class="bar" style="margin:0;gap:6px"><select style="width:auto" onchange="per=$('#pY').value+'-'+this.value;render()">${MES.map((n,i)=>{const v=String(i+1).padStart(2,'0');return`<option value="${v}" ${v===m?'selected':''}>${n}</option>`}).join('')}</select><select id="pY" style="width:auto" onchange="per=this.value+'-${m}';render()">${ys}</select></div>`};
const statBox=(i,top,n,l,cls)=>`<div class="card st"><div class="top"><div class="ic">${i}</div><em>${top}</em></div><div class="n ${cls||''}">${n}</div><div class="l">${l}</div></div>`;
function sessRow(s,full){return`<div class="row" onclick="edS('${s.id}')" style="cursor:pointer"><div class="t">${s.hora||'—'}<small>${full?fd(s.data):(s.fim||'')}</small></div><div class="m">${esc(s.desc)}<small>${esc(cname(s.cid))}${s.estilo?' · '+esc(s.estilo):''}${s.cm?' · '+s.cm+' cm':''}${s.cart?' · '+s.cart+(s.cart==1?' cartucho':' cartuchos'):''}</small></div>${full?`<div class="v"><b>${R(s.valor)}</b>material ${R(s.material)} · lucro ${R((s.valor||0)-(s.material||0))}${s.pago?' · pago':''}${dur(s)?' · ⏱ '+dur(s):''}</div>`:''}<span class="bd ${stCls(s.status)}">${esc(s.status||'Pendente')}</span></div>`}
const dur=s=>{if(!s.hora||!s.fim)return'';const a=s.hora.split(':'),b=s.fim.split(':');let m=(b[0]*60+ +b[1])-(a[0]*60+ +a[1]);if(m<0)m+=1440;return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const sortS=l=>l.slice().sort((a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')));
function vDash(){const h=new Date().getHours(),g=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
 const ps=db.sessions.filter(s=>inP(s.data)&&live(s)&&(!est||s.estilo===est)),conf=ps.filter(s=>s.status==='Confirmado'||s.status==='Concluído').length;
 const all=db.sessions.filter(live),saldo=sumS(all,'valor')-sumS(all,'material')-sumS(db.personal,'valor');
 
 const ag=sortS(db.sessions.filter(s=>live(s)&&inP(s.data)&&s.data>=today()&&(!est||s.estilo===est))).slice(0,6);
 return`<header><div><h1>${g}, ${esc(db.studio)}! 👋</h1><div class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div></div>${filt()}</header>
 <div class="grid">${statBox('📅',conf+' confirmadas',ps.length,'Sessões no período')}${statBox('💲','No período',R(sumS(ps,'valor')),'Faturamento')}${statBox('👥','Total',db.clients.length,'Clientes')}${statBox('📈',saldo>=0?'Positivo':'Negativo',R(saldo),'Saldo total',saldo>=0?'':'neg')}</div>
 
 <div class="card"><div class="bar" style="justify-content:space-between;margin:0"><h2>Agenda do período</h2><a href="#" style="color:var(--gt);text-decoration:none" onclick="go('ses');return false">Ver tudo ›</a></div>
 ${ag.map(s=>sessRow(s)).join('')||'<div class="empty">Nenhuma sessão futura neste período.</div>'}</div>`}
function vCli(){const l=db.clients.filter(c=>(c.nome+c.tel).toLowerCase().includes(q.toLowerCase()));
 return`<header><div><h1>Clientes</h1><div class="sub">Dados, anamnese e aceite do termo</div></div></header>
 <div class="bar"><input placeholder="Buscar cliente…" value="${esc(q)}" oninput="q=this.value;render();const e=$('.bar input');e.focus();e.setSelectionRange(99,99)"><button class="btn" onclick="addC()">+ Novo cliente</button></div>
 ${l.map(c=>{const ss=db.sessions.filter(s=>s.cid===c.id&&live(s));return`<div class="row" style="cursor:pointer" onclick="edC('${c.id}')"><div class="m">${esc(c.nome)}<small>${esc(c.tel||'sem telefone')} · ${ss.length} sessões · ${R(sumS(ss,'valor'))}</small></div><span class="bd ${c.aceite?'':'p'}">${c.aceite?'Termo aceito'+(c.aceiteData?' em '+fd(c.aceiteData):''):'Termo pendente'}</span></div>`}).join('')||'<div class="empty">Nenhum cliente encontrado.</div>'}`}
function vSes(){const l=sortS(db.sessions.filter(s=>inP(s.data)&&(!est||s.estilo===est))).reverse(),a=l.filter(live),f=sumS(a,'valor'),m=sumS(a,'material');
 return`<header><div><h1>Tatuagens e financeiro</h1><div class="sub">Quanto cobrou, quanto gastou de material e o lucro</div></div>${filt()}</header>
 <div class="grid">${statBox('💲','','R$ '+f.toLocaleString('pt-BR'),'Faturado')}${statBox('🧪','','R$ '+m.toLocaleString('pt-BR'),'Materiais')}${statBox('📈','','R$ '+(f-m).toLocaleString('pt-BR'),'Lucro das tatuagens',f-m<0?'neg':'')}${statBox('⏳','',R(sumS(a.filter(s=>!s.pago),'valor')),'A receber')}</div>
 <div class="bar"><button class="btn" onclick="addS()">+ Nova sessão</button></div>${l.map(s=>sessRow(s,1)).join('')||'<div class="empty">Sem sessões neste mês.</div>'}`}
function vPes(){const l=db.personal.filter(p=>inP(p.data)).sort((a,b)=>b.data.localeCompare(a.data)),t=sumS(l,'valor');
 return`<header><div><h1>Custos pessoais</h1><div class="sub">Contas e gastos fora das tatuagens</div></div>${monthIn()}</header>
 <div class="grid">${statBox('💳','no mês',R(t),'Total de custos pessoais')}</div><div class="bar"><button class="btn" onclick="addP()">+ Novo custo</button></div>
 ${l.map(p=>`<div class="row" style="cursor:pointer" onclick="edP('${p.id}')"><div class="t">${fd(p.data).slice(0,5)}</div><div class="m">${esc(p.desc)}<small>${esc(p.cat)}</small></div><div class="v"><b>${R(p.valor)}</b></div></div>`).join('')||'<div class="empty">Sem custos neste mês.</div>'}`}
function vEst(){const l=db.stock.filter(s=>s.nome.toLowerCase().includes(q.toLowerCase())),tv=db.stock.reduce((a,s)=>a+s.qtd*s.custo,0),bp=db.buys.filter(b=>inP(b.data)).reduce((a,b)=>a+b.qtd*b.custo,0);
 return`<header><div><h1>Estoque</h1><div class="sub">Materiais, custos e compras</div></div>${monthIn()}</header>
 <div class="grid">${statBox('📦','',db.stock.length,'Itens cadastrados')}${statBox('💰','',R(tv),'Valor em estoque')}${statBox('🛒','no período',R(bp),'Compras')}</div>
 <div class="bar"><input placeholder="Buscar material…" value="${esc(q)}" oninput="q=this.value;render();const e=$('.bar input');e.focus();e.setSelectionRange(99,99)"><button class="btn" onclick="addK()">+ Novo material</button></div>
 ${l.map(s=>{const lo=s.min>0&&s.qtd<=s.min;return`<div class="row"><div class="m" style="cursor:pointer" onclick="edK('${s.id}')">${esc(s.nome)}<small>${esc(s.cat)} · ${R(s.custo)} / ${esc(s.un)}</small></div><span class="bd ${lo?'x':''}">${s.qtd} ${esc(s.un)}</span><div class="acts"><button class="btn s" onclick="buy('${s.id}')">+ Compra</button><button class="btn s" onclick="use('${s.id}')">− Baixa</button></div></div>`}).join('')||'<div class="empty">Nenhum material cadastrado.</div>'}`}
function toMD(){const T=(h,rows)=>rows.length?`| ${h.join(' | ')} |\n|${h.map(()=>'---').join('|')}|\n${rows.map(r=>'| '+r.map(x=>String(x==null?'':x).replace(/\|/g,'/')).join(' | ')+' |').join('\n')}\n`:'_Sem registros._\n';
 return`# HelpInk — Backup de ${db.studio}\nGerado em ${new Date().toLocaleString('pt-BR')}\n\n## Clientes\n${T(['Nome','Telefone','E-mail','Termo aceito'],db.clients.map(c=>[c.nome,c.tel,c.email,c.aceite?'Sim '+fd(c.aceiteData):'Não']))}\n## Tatuagens\n${T(['Data','Cliente','Serviço','Estilo','Tamanho (cm)','Cartuchos','Duração','Valor','Material','Status','Pago'],db.sessions.map(s=>[fd(s.data),cname(s.cid),s.desc,s.estilo,s.cm,s.cart,dur(s),s.valor,s.material,s.status,s.pago?'Sim':'Não']))}\n## Custos pessoais\n${T(['Data','Descrição','Categoria','Valor'],db.personal.map(p=>[fd(p.data),p.desc,p.cat,p.valor]))}\n## Estoque\n${T(['Material','Qtd','Comprado em','Acabou em'],db.stock.map(s=>[s.nome,s.qtd,fd(s.compra),s.fim?fd(s.fim):'Em uso']))}\n## Dados para importação (não edite)\n\`\`\`json\n${JSON.stringify(db)}\n\`\`\`\n`}
function vBkp(){return`<header><div><h1>Conta e backup</h1><div class="sub">Seus dados ficam salvos na nuvem, na sua conta</div></div></header>
 <div class="card" style="margin-bottom:14px"><h2>Sua conta</h2><div class="bar" style="margin:10px 0 0;justify-content:space-between"><div class="sub" style="margin:0">Conectado como <b>${esc(user&&user.email)}</b></div><button class="btn s d" onclick="sair()">Sair</button></div></div>
 <div class="card"><label>Nome do estúdio</label><input value="${esc(db.studio)}" onchange="db.studio=this.value||'Meu Estúdio';db.named=!!this.value;save()">
 <h2 style="margin-top:22px">Exportar para .md</h2><div class="bar" style="margin-top:10px"><button class="btn" onclick="dl()">⬇ Baixar arquivo .md</button><button class="btn s" onclick="cp()">Copiar texto</button></div>
 <div class="sub">Se o download for bloqueado pelo navegador, copie o texto abaixo e salve num arquivo .md.</div><textarea class="big" id="out" readonly onfocus="this.select()" style="margin-top:10px">${esc(toMD())}</textarea>
 <h2 style="margin-top:22px">Importar de outro computador</h2><div class="bar" style="margin-top:10px"><input type="file" accept=".md,.txt" onchange="rd(this.files[0])"></div>
 <textarea class="big" id="inp" placeholder="…ou cole aqui o conteúdo do arquivo .md"></textarea><div class="bar" style="margin-top:10px"><button class="btn" onclick="imp($('#inp').value)">Importar (substitui os dados atuais)</button></div></div>`}
function dl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([toMD()],{type:'text/markdown'}));a.download='helpink-backup-'+today()+'.md';document.body.appendChild(a);a.click();a.remove()}catch(e){alert('Download bloqueado. Use "Copiar texto".')}}
function cp(){const t=$('#out');t.select();try{navigator.clipboard.writeText(t.value).then(()=>alert('Copiado!'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}}
function rd(f){if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f)}
function imp(t){const m=/```json\s*([\s\S]*?)```/.exec(t||'');if(!m){alert('Arquivo inválido: bloco de dados não encontrado.');return}
 try{const d=JSON.parse(m[1]);if(!confirm('Substituir todos os dados atuais pelos do arquivo?'))return;db=Object.assign({studio:'Meu Estúdio',clients:[],sessions:[],personal:[],stock:[],buys:[]},d);save();alert('Dados importados!');go('dash')}catch(e){alert('Não foi possível ler os dados.')}}
const acabou=id=>{db.stock.find(x=>x.id===id).fim=today();save();render()};
const dias=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/864e5));
function vEst2(){const l=db.stock.filter(s=>s.nome.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.compra||'').localeCompare(a.compra||'')),em=db.stock.filter(s=>!s.fim).length;
 return`<header><div><h1>Estoque</h1><div class="sub">Quando você comprou e quando acabou cada material</div></div></header>
 <div class="grid">${statBox('📦','',db.stock.length,'Materiais cadastrados')}${statBox('⏳','',em,'Em uso')}${statBox('✅','',db.stock.length-em,'Já acabaram')}</div>
 <div class="bar"><input placeholder="Buscar material…" value="${esc(q)}" oninput="q=this.value;render();const e=$('.bar input');e.focus();e.setSelectionRange(99,99)"><button class="btn" onclick="addK()">+ Novo material</button></div>
 ${l.map(s=>`<div class="row"><div class="m" style="cursor:pointer" onclick="edK('${s.id}')">${esc(s.nome)}<small>${s.qtd?'Qtd '+s.qtd+' · ':''}Comprado em ${fd(s.compra)||'—'}${s.fim?' · acabou em '+fd(s.fim):''}</small></div><span class="bd ${s.fim?'c':''}">${s.fim?(s.compra?'Durou '+dias(s.compra,s.fim)+' dias':'Acabou'):'Em uso'}</span>${s.fim?'':`<button class="btn s" onclick="acabou('${s.id}')">Acabou hoje</button>`}</div>`).join('')||'<div class="empty">Nenhum material cadastrado.</div>'}`}
const V={dash:vDash,cli:vCli,ses:vSes,pes:vPes,est:vEst2,bkp:vBkp,usr:vUsr};
function render(){$('#nav').innerHTML=navH();$('#main').innerHTML=V[tab]()}
function askName(){$('#mod').innerHTML=`<div class="modal"><div><h2>Bem-vindo ao HelpInk! 👋</h2><div class="sub">Como devemos chamar você ou o seu estúdio?</div><label>Seu nome ou nome do estúdio</label><input id="nm" maxlength="40" placeholder="Ex.: Estúdio do Amin"><div class="bar" style="margin:18px 0 0"><button class="btn" id="nmok">Começar</button></div></div></div>`;
 const ok=()=>{const v=$('#nm').value.trim();if(!v){$('#nm').focus();return}db.studio=v;db.named=1;save();closeM();render()};
 $('#nmok').onclick=ok;$('#nm').onkeydown=e=>{if(e.key==='Enter')ok()};setTimeout(()=>$('#nm').focus(),50)}
/* ---- Conta (o login é feito pelo Cloudflare Access antes de o site abrir) ---- */
function screen(h){$('#app').style.display='none';closeM();const A=$('#auth');A.style.display='';A.innerHTML=`<div class="auth"><div class="card"><div class="logo"><b>H</b><span>HelpInk</span></div>${h}</div></div>`}
let me=null;
const btns=b=>`<div class="bar" style="margin:18px 0 0">${b}<button class="btn s" onclick="sair()">Sair</button></div><div class="sub" style="margin-top:12px">Conectado como ${esc(me&&me.email)}</div>`;
function failV(e){console.error(e);screen(`<h2>Não foi possível carregar</h2><div class="note neg">${esc(e.message)}</div><div class="bar" style="margin:18px 0 0"><button class="btn" onclick="location.reload()">${e.auth?'Entrar':'Tentar de novo'}</button></div>`)}
function signupV(msg,v){v=v||{};
 screen(`<h2>Criar sua conta</h2><div class="sub">Você entrou como <b>${esc(me.email)}</b>. Preencha seus dados para pedir acesso ao HelpInk.</div>
 <label>Seu nome *</label><input id="su_n" maxlength="80" autocomplete="name" value="${esc(v.nome)}">
 <label>Nome do estúdio</label><input id="su_e" maxlength="80" value="${esc(v.estudio)}">
 <label>Telefone / WhatsApp</label><input id="su_t" type="tel" maxlength="30" autocomplete="tel" value="${esc(v.telefone)}">
 ${msg?`<div class="note neg">${esc(msg)}</div>`:''}<div class="note">Seu acesso será liberado assim que o administrador aprovar o cadastro.</div>
 ${btns('<button class="btn" id="su_ok" style="flex:1">Pedir acesso</button>')}`);
 const ok=async()=>{const d={nome:$('#su_n').value.trim(),estudio:$('#su_e').value.trim(),telefone:$('#su_t').value.trim()};if(!d.nome)return $('#su_n').focus();
  const b=$('#su_ok');b.textContent='Enviando…';b.style.pointerEvents='none';
  try{await api('/api/signup',d);start()}catch(e){if(e.auth)return failV(e);signupV(e.message,d)}};
 $('#su_ok').onclick=ok;for(const i of document.querySelectorAll('#auth input'))i.onkeydown=e=>{if(e.key==='Enter')ok()};setTimeout(()=>$('#su_n').focus(),50)}
async function start(){snap=null;screen('<div class="sub">Carregando…</div>');
 try{me=await api('/api/me')}catch(e){return failV(e)}
 user={email:me.email,admin:me.admin};
 if(me.status==='none')return signupV();
 if(me.status==='pending')return screen(`<h2>Cadastro enviado ✅</h2><div class="sub">Olá, ${esc(me.user.nome)}! Recebemos seu pedido de acesso.</div><div class="note">Você poderá usar o HelpInk assim que o administrador aprovar o cadastro. Volte mais tarde ou toque em "Verificar de novo".</div>${btns('<button class="btn" onclick="start()">Verificar de novo</button>')}`);
 if(me.status!=='approved')return screen(`<h2>Acesso não liberado</h2><div class="sub">Seu pedido de acesso não foi aprovado. Em caso de dúvida, fale com o administrador do HelpInk.</div>${btns('')}`);
 try{const n=await loadDB();
  if(!n){const L=legacy();if(L&&confirm('Encontramos dados do HelpInk salvos neste navegador (versão antiga). Deseja enviá-los para a sua conta?')){db=Object.assign(blank(),L);await save();if(syncErr)alert('Não foi possível enviar todos os dados. Eles continuam salvos neste navegador; tente de novo pela opção "toque para tentar de novo".');else clearLegacy()}}
 }catch(e){return failV(e)}
 if(!db.named&&me.user&&me.user.estudio){db.studio=me.user.estudio;db.named=1;save()}
 $('#auth').style.display='none';$('#app').style.display='';tab='dash';render();showSync();
 if(user.admin)loadUsers();
 if(!db.named&&(!db.studio||db.studio==='Meu Estúdio'))askName()}
async function sair(){await queue;if(syncErr&&!syncErr.auth&&!confirm('Algumas alterações não foram salvas e serão perdidas. Sair mesmo assim?'))return;
 syncErr=null;location.href='/cdn-cgi/access/logout'}
start();
</script></body></html>
