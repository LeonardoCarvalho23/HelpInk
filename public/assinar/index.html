<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ficha de anamnese · HelpInk</title>
<link rel="preload" href="/assinar/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(/assinar/fonts/instrument-sans-latin.woff2) format("woff2")}@font-face{font-family:"Grenze Gotisch";font-style:normal;font-weight:600;font-display:swap;src:url(/assinar/fonts/grenze-gotisch-600-latin.woff2) format("woff2")}</style>
<style>
:root{color-scheme:light;
 --paper:#F4F4F7;--surface:#FFFFFF;--raised:#F8F7FB;--line:#E4E2EA;--line-2:#D2CFDB;
 --ink:#1D1A24;--ink-2:#46414F;--mute:#6B6578;
 --stencil:#5536C8;--stencil-ink:#FFFFFF;--stencil-soft:#EEEAFB;--stencil-line:#B4A6EC;
 --ok:#1E7A55;--ok-soft:#E2F2EA;--warn:#9E5604;--warn-soft:#FBEED8;--bad:#BE3048;--bad-soft:#FBE6E9;
 --f:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-mark:"Grenze Gotisch",Georgia,serif}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;
 --paper:#121017;--surface:#1A1720;--raised:#221E2A;--line:#2C2735;--line-2:#3B3546;
 --ink:#EEEAF6;--ink-2:#CBC5D8;--mute:#9A92AB;
 --stencil:#A893FF;--stencil-ink:#170F35;--stencil-soft:#2A2340;--stencil-line:#5D4E96;
 --ok:#5FCB9A;--ok-soft:#163026;--warn:#F0B25A;--warn-soft:#35260F;--bad:#FF7D90;--bad-soft:#3A1820}}
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.55 var(--f);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
main{max-width:680px;margin:0 auto;padding:22px 16px calc(48px + env(safe-area-inset-bottom,0px))}
.logo{font-family:var(--f-mark);font-weight:600;font-size:30px;line-height:1;margin-bottom:22px;color:var(--ink)}
h1{font-size:27px;line-height:1.15;font-weight:650;letter-spacing:-.018em;margin:0 0 4px}
h2{font-size:19px;line-height:1.3;font-weight:600;margin:0 0 4px}
.sub{color:var(--mute);font-size:14.5px}
:focus-visible{outline:2px solid var(--stencil);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
label{display:block;font-size:14px;font-weight:500;color:var(--ink-2);margin:16px 0 6px}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;min-height:46px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--stencil);box-shadow:0 0 0 3px var(--stencil-soft)}
textarea{min-height:88px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.8}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
/* Perguntas: Sim/Não como botões grandes, fáceis de tocar */
.q{padding:16px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0;padding-top:6px}
.q p{margin:0 0 10px;font-weight:500}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:280px}
.yn label{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:500;cursor:pointer}
.yn input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.yn label:has(input:checked){border-color:var(--stencil);background:var(--stencil-soft);color:var(--stencil);font-weight:600}
.yn label:has(input:focus-visible){outline:2px solid var(--stencil);outline-offset:2px}
.ck{display:flex;gap:12px;align-items:flex-start;color:var(--ink);font-size:15px;font-weight:400;margin:14px 0;cursor:pointer;line-height:1.45}
.ck input{width:22px;height:22px;min-height:0;flex:none;margin-top:1px;accent-color:var(--stencil)}
ol{padding-left:22px;margin:14px 0}ol li{margin-bottom:8px;color:var(--ink-2)}
.note{font-size:14px;line-height:1.5;background:var(--raised);border:1px solid var(--line);padding:12px 14px;border-radius:10px;color:var(--ink-2);margin-top:14px}
.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.err{background:var(--bad-soft);color:var(--bad);border-color:transparent}.okb{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.err ul{margin:6px 0 0;padding-left:18px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--stencil);color:var(--stencil-ink);font:600 16px var(--f);cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.s{background:var(--surface);color:var(--ink);border-color:var(--line-2);font-weight:500}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.bar .btn{flex:1;min-width:180px}
code{font-family:ui-monospace,Consolas,monospace;word-break:break-all;font-size:13px;background:var(--raised);border:1px solid var(--line);padding:8px 10px;border-radius:8px;display:block;margin-top:6px;color:var(--ink-2)}
/* Assinatura: área destacada com contorno tracejado, como o decalque */
.sign{border:1.5px dashed var(--stencil-line);background:var(--raised)}
.sign input{font-size:18px;font-weight:500}
.q.miss p{color:var(--bad)}.q.miss .yn label{border-color:var(--bad)}.ck.miss{color:var(--bad)}
.hide{display:none}
@media(max-width:560px){.f2{grid-template-columns:1fr}h1{font-size:24px}.card{padding:18px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="m"><div class="logo">HelpInk</div><p class="sub">Carregando sua ficha…</p></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=location.hash.slice(1);let F=null;
const dt=iso=>new Date(iso).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const head=()=>`<div class="logo">HelpInk</div>`;
function msg(t,b,cls){$('#m').innerHTML=head()+`<div class="card"><h1>${t}</h1><div class="note ${cls||''}">${b}</div></div>`}
async function call(path,body){let r;try{r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'})}catch(e){throw new Error('Sem conexão. Verifique sua internet e tente de novo.')}
 const j=await r.json().catch(()=>null);if(!j)throw new Error('Erro do servidor ('+r.status+'). Tente de novo.');if(!r.ok){const e=new Error(j.error||'Erro');e.list=j.errors;throw e}return j}
function maskD(e){let v=e.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.value=v}
function maskC(e){let v=e.value.replace(/\D/g,'').slice(0,11);e.value=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
const iso=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s.trim());return m?m[3]+'-'+m[2]+'-'+m[1]:''};
function ageOf(isoD){if(!isoD)return null;const b=new Date(isoD+'T00:00:00'),n=new Date();if(isNaN(b))return null;let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
async function init(){
 if(!/^[A-Za-z0-9_-]{43}$/.test(T))return msg('Link incompleto','Abra o link completo que o estúdio enviou para você (incluindo a parte depois do #).','warn');
 try{F=await call('/assinar/api/form',{t:T})}catch(e){return msg('Link inválido',esc(e.message),'err')}
 if(F.status==='signed')return msg('Ficha já assinada ✅',`Esta ficha foi assinada em ${dt(F.signed_at)}.<br>Código de verificação (SHA-256): <code>${esc(F.doc_hash)}</code><br>Se precisar de uma cópia, peça ao estúdio.`,'okb');
 if(F.status==='expired')return msg('Link expirado','Este link não é mais válido. Peça um novo link ao estúdio.','warn');
 form()}
const dBR=d=>String(d||'').split('-').reverse().join('/');
function form(){const t=F.term,p=t.proc;
 $('#m').innerHTML=head()+`<h1>Ficha de anamnese</h1><p class="sub">${esc(F.studio)}. Link válido até ${dt(F.expires_at)}.</p>
 <div class="card"><div>Olá${F.hint?', '+esc(F.hint):''}! Antes da sua sessão${p&&p.data?' de '+esc(dBR(p.data)):''}, preencha seus dados e sua ficha de saúde e assine o termo de consentimento. Leva uns 5 minutos.</div>
 <div class="note">Suas respostas são confidenciais e usadas apenas pelo estúdio para a sua segurança durante o procedimento.</div></div>
 ${p?`<div class="card"><h2>Procedimento</h2><div class="sub">Esta ficha vale para ${p.tatuagens.length==1?'a tatuagem abaixo':'as '+p.tatuagens.length+' tatuagens abaixo'}${p.data?', na sessão de '+esc(dBR(p.data))+(p.hora?' às '+esc(p.hora):''):''}. Para outra tatuagem ou outra sessão, o estúdio envia uma nova ficha.</div>
  <ol>${p.tatuagens.map(x=>`<li>${esc(x.desc)}${x.estilo||x.cm?' <span class="sub">('+esc([x.estilo,x.cm?x.cm+' cm':''].filter(Boolean).join(', '))+')</span>':''}</li>`).join('')}</ol></div>`:''}
 <div class="card"><h2>1. Seus dados</h2>
  <label>Nome completo *</label><input id="nome" autocomplete="name" maxlength="120">
  <div class="f2"><div><label>CPF *</label><input id="cpf" inputmode="numeric" maxlength="14" oninput="maskC(this)"></div>
  <div><label>Data de nascimento *</label><input id="nasc" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" oninput="maskD(this);minor()"></div>
  <div><label>Telefone / WhatsApp</label><input id="tel" type="tel" autocomplete="tel" maxlength="30"></div>
  <div><label>E-mail</label><input id="email" type="email" autocomplete="email" maxlength="120"></div></div>
 </div>
 <div class="card hide" id="respBox"><h2>Responsável legal</h2>
  <div class="note warn">Como o cliente é menor de 18 anos, a ficha deve ser preenchida e assinada pelo pai, mãe ou responsável legal. Em alguns estados a tatuagem em menores é proibida mesmo com autorização.</div>
  <label>Nome completo do responsável *</label><input id="rnome" maxlength="120">
  <div class="f2"><div><label>CPF do responsável *</label><input id="rcpf" inputmode="numeric" maxlength="14" oninput="maskC(this)"></div>
  <div><label>Parentesco *</label><input id="rpar" maxlength="40" placeholder="Mãe, pai, tutor…"></div></div>
 </div>
 <div class="card"><h2>2. Ficha de saúde (anamnese)</h2>
  ${t.questions.map(q=>`<div class="q" data-q="${esc(q.id)}"><p>${esc(q.q)} *</p><div class="yn">
   <label><input type="radio" name="q_${esc(q.id)}" value="sim" onchange="det('${esc(q.id)}')">Sim</label>
   <label><input type="radio" name="q_${esc(q.id)}" value="nao" onchange="det('${esc(q.id)}')">Não</label></div>
   ${q.det?`<div class="hide" id="d_${esc(q.id)}"><label>${esc(q.det)}${q.opt?'':' *'}</label><input id="t_${esc(q.id)}" maxlength="500"></div>`:''}</div>`).join('')}
  <label>Outras observações sobre sua saúde (opcional)</label><textarea id="obs" maxlength="1000"></textarea>
 </div>
 <div class="card"><h2>3. Termo de consentimento</h2><div class="sub">Versão ${esc(t.version)}</div>
  <ol>${t.text.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
  ${t.decls.map(d=>`<label class="ck"><input type="checkbox" id="c_${esc(d.id)}">${esc(d.t)}${d.req?' *':''}</label>`).join('')}
  <div class="note"><b>Aviso de privacidade.</b> ${esc(t.privacy)}</div>
 </div>
 <div class="card sign"><h2>4. Assinatura</h2>
  <div class="sub" id="sigLbl">Para assinar, digite seu nome completo exatamente como informado acima.</div>
  <label>Assinatura (nome completo) *</label><input id="sig" maxlength="120" autocomplete="off">
  <div class="note">Ao clicar em "Assinar ficha", você assina eletronicamente este documento. Registramos data, hora, endereço IP e dispositivo, e você recebe uma cópia com um código que comprova que ela não foi alterada.</div>
  <div id="errs"></div>
  <div class="bar"><button class="btn" id="go">Assinar ficha</button></div>
 </div>`;
 $('#go').onclick=sign;}
function det(id){const qe=document.querySelector(`[data-q="${id}"]`);if(qe)qe.classList.remove('miss');const v=(document.querySelector(`input[name="q_${id}"]:checked`)||{}).value,b=$('#d_'+id);if(b)b.classList.toggle('hide',v!=='sim')}
function minor(){const a=ageOf(iso($('#nasc').value)),m=a!==null&&a<18;$('#respBox').classList.toggle('hide',!m);
 $('#sigLbl').textContent=m?'Para assinar, o responsável legal deve digitar o próprio nome completo, exatamente como informado acima.':'Para assinar, digite seu nome completo exatamente como informado acima.';return m}
async function sign(){const t=F.term,b=$('#go');
 const data={nome:$('#nome').value,cpf:$('#cpf').value,nasc:iso($('#nasc').value),tel:$('#tel').value,email:$('#email').value,obs:$('#obs').value,assinatura:$('#sig').value,answers:{},decls:{}};
 if(minor())data.resp={nome:$('#rnome').value,cpf:$('#rcpf').value,parentesco:$('#rpar').value};
 for(const q of t.questions){const v=(document.querySelector(`input[name="q_${q.id}"]:checked`)||{}).value||'';data.answers[q.id]={v,d:q.det?$('#t_'+q.id).value:''}}
 for(const d of t.decls)data.decls[d.id]=$('#c_'+d.id).checked;
 b.textContent='Assinando…';b.style.pointerEvents='none';$('#errs').innerHTML='';
 try{const r=await call('/assinar/api/sign',{t:T,data});done(r)}
 catch(e){b.textContent='Assinar ficha';b.style.pointerEvents='';showErrs(e)}}
// Resume os erros e destaca no formulário o que falta (em vez de uma lista enorme)
function showErrs(e){const t=F.term,L=e.list||[],pre=p=>L.filter(x=>x.startsWith(p));
 const resp=pre('Responda: '),det=pre('Detalhe a resposta: '),dec=pre('Marque a declaração'),rest=L.filter(x=>!resp.includes(x)&&!det.includes(x)&&!dec.includes(x));
 let first=null;
 for(const el of $$('.q')){const q=t.questions.find(q=>q.id===el.dataset.q),m=!!q&&(resp.includes('Responda: '+q.q)||det.includes('Detalhe a resposta: '+q.q));el.classList.toggle('miss',m);if(m&&!first)first=el}
 for(const d of t.decls){const c=$('#c_'+d.id);c.closest('label').classList.toggle('miss',d.req&&!c.checked&&dec.length>0)}
 const items=[...rest];
 if(resp.length)items.push(`Responda ${resp.length==1?'a pergunta destacada':'as '+resp.length+' perguntas destacadas'} da ficha de saúde.`);
 if(det.length)items.push(`Detalhe ${det.length==1?'a resposta "Sim" destacada':'as '+det.length+' respostas "Sim" destacadas'}.`);
 if(dec.length)items.push(`Marque ${dec.length==1?'a declaração obrigatória destacada':'as '+dec.length+' declarações obrigatórias destacadas'} do termo.`);
 $('#errs').innerHTML=`<div class="note err" role="alert"><b>${esc(e.message)}</b>${items.length?'<ul>'+items.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}</div>`;
 (rest.length||!first?$('#errs'):first).scrollIntoView({behavior:'smooth',block:'center'})}
let DOC=null;
async function done(r){DOC=r;
 let ok='';try{const d=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(r.doc)));ok=[...d].map(x=>x.toString(16).padStart(2,'0')).join('')===r.doc_hash?' ✔ conferido':''}catch(e){}
 $('#m').innerHTML=head()+`<div class="card"><h1>Ficha assinada ✅</h1><div class="sub">${esc(r.studio)} · ${dt(r.signed_at)}</div>
 <div class="note okb">Pronto! Sua ficha foi assinada e enviada ao estúdio.</div>
 <h2 style="margin-top:18px">Sua via assinada</h2>
 <div class="sub">Baixe e guarde o arquivo abaixo. Ele é a sua cópia do documento assinado.</div>
 <div class="bar"><button class="btn" onclick="dl()">⬇ Baixar minha cópia</button><button class="btn s" onclick="openDoc()">Abrir / imprimir</button></div>
 <label>Código de verificação (SHA-256)${ok}</label><code>${esc(r.doc_hash)}</code>
 <div class="note">Este código é a "impressão digital" do arquivo: se qualquer letra do documento for alterada, o código muda. Anote ou tire um print desta tela. Por segurança, depois de fechar esta página a ficha não poderá mais ser vista por este link.</div></div>`}
const blob=()=>new Blob([DOC.doc],{type:'text/html;charset=utf-8'});
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(blob());a.download='ficha-anamnese-'+DOC.signed_at.slice(0,10)+'.html';document.body.appendChild(a);a.click();a.remove()}
function openDoc(){window.open(URL.createObjectURL(blob()),'_blank','noopener')}
init();
</script></body></html>
